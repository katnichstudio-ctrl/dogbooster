<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครเรียน — DogBooster</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold:#F0B74C; --gold-dark:#E0A02F; --dark:#15130F; --cream:#FAF7F1; --bg:#E7E2D7; --border:#E4DECF; --muted:#6B6459; --red:#B4452F; }
    html, body { font-family:'LINE Seed Sans TH',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--dark); -webkit-font-smoothing:antialiased; }
    .wrap { max-width: 460px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { font-size: 22px; font-weight: 800; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .card { background:#fff; border:1px solid var(--border); border-radius:18px; padding:22px; margin-top:20px; }
    label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; }
    .field-group { margin-bottom:16px; }
    input, select { width:100%; padding:13px 15px; border:1.5px solid var(--border); border-radius:12px; font-family:inherit; font-size:15px; font-weight:600; outline:none; background:#fff; }
    input:focus, select:focus { border-color: var(--gold); }
    .price { font-size:13px; color:var(--muted); margin-top:6px; }
    .price b { color:var(--dark); }

    .btn { width:100%; border:none; border-radius:100px; padding:15px; font-family:inherit; font-weight:800; font-size:15px; cursor:pointer; color:var(--dark); background:var(--gold); }
    .btn:hover { background: var(--gold-dark); }
    .btn:disabled { opacity:.6; cursor:not-allowed; }

    .msg { font-size:13px; margin-top:12px; text-align:center; }
    .msg.err { color: var(--red); }

    .empty { padding:30px; text-align:center; color:var(--muted); font-size:14px; }

    .done { text-align:center; padding:20px 4px; }
    .done .check { font-size:44px; }
    .done h2 { font-size:20px; font-weight:800; margin-top:10px; }
    .done p { color:var(--muted); font-size:14px; margin-top:8px; line-height:1.6; }
    .done .summary { margin-top:16px; background:var(--cream); border-radius:12px; padding:14px; text-align:left; font-size:14px; }
    .done .summary div + div { margin-top:4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>สมัครเรียน DogBooster</h1>
    <p class="sub">เลือกคลาสที่สนใจ กรอกข้อมูลให้ครบ แล้วทีมงานจะติดต่อกลับเพื่อนัดชำระเงิน/ยืนยันคิว</p>

    <div id="formCard" class="card">
      <form id="regForm">
        <div class="field-group">
          <label>คลาสที่สนใจ</label>
          <select id="classId" required></select>
          <p id="priceHint" class="price"></p>
        </div>
        <div class="field-group">
          <label>ชื่อ-นามสกุล</label>
          <input id="customerName" required placeholder="ชื่อ-นามสกุลของคุณ">
        </div>
        <div class="field-group">
          <label>เบอร์โทร</label>
          <input id="customerPhone" required type="tel" placeholder="08X-XXX-XXXX">
        </div>
        <div class="field-group">
          <label>รหัสแนะนำ/รหัสสตาฟ (ถ้ามี)</label>
          <input id="staffCode" placeholder="ไม่บังคับ">
        </div>
        <button class="btn" type="submit" id="submitBtn">ส่งใบสมัคร</button>
        <p id="formMsg" class="msg err"></p>
      </form>
    </div>

    <div id="emptyCard" class="card empty" style="display:none">
      ตอนนี้ยังไม่มีคลาสเปิดรับสมัคร กลับมาเช็กอีกครั้งภายหลัง
    </div>

    <div id="doneCard" class="card done" style="display:none">
      <div class="check">✅</div>
      <h2>ส่งใบสมัครสำเร็จ</h2>
      <p>ทีมงาน DogBooster จะติดต่อกลับตามเบอร์ที่ให้ไว้เพื่อนัดชำระเงิน/ยืนยันคิว</p>
      <div class="summary" id="doneSummary"></div>
    </div>
  </div>

  <script>
    var CLASSES = [];

    function escHtml(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function fmtPrice(n) {
      return Number(n || 0).toLocaleString('th-TH');
    }

    function updatePriceHint() {
      var sel = document.getElementById('classId');
      var cls = CLASSES.find(function (c) { return c.id === sel.value; });
      document.getElementById('priceHint').innerHTML = cls
        ? 'ราคา <b>' + fmtPrice(cls.price) + ' บาท</b>'
        : '';
    }

    async function loadClasses() {
      var r = await fetch('/api/classes');
      var data = await r.json();
      CLASSES = data.classes || [];
      var sel = document.getElementById('classId');
      if (CLASSES.length === 0) {
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('emptyCard').style.display = 'block';
        return;
      }
      sel.innerHTML = CLASSES.map(function (c) {
        return '<option value="' + c.id + '">' + escHtml(c.label) + '</option>';
      }).join('');
      updatePriceHint();
      sel.addEventListener('change', updatePriceHint);
    }

    document.getElementById('regForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('formMsg');
      msg.textContent = '';

      var classId = document.getElementById('classId').value;
      var customerName = document.getElementById('customerName').value.trim();
      var customerPhone = document.getElementById('customerPhone').value.trim();
      var staffCode = document.getElementById('staffCode').value.trim();

      if (!classId || !customerName || !customerPhone) {
        msg.textContent = 'กรุณากรอกข้อมูลให้ครบ';
        return;
      }

      btn.disabled = true;
      try {
        var r = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ classId: classId, customerName: customerName, customerPhone: customerPhone, staffCode: staffCode })
        });
        var data = await r.json();
        if (!r.ok) throw new Error(data.error || ('error ' + r.status));

        var cls = CLASSES.find(function (c) { return c.id === classId; });
        document.getElementById('doneSummary').innerHTML =
          '<div><b>คลาส:</b> ' + escHtml(cls ? cls.label : '') + '</div>' +
          '<div><b>ราคา:</b> ' + fmtPrice(cls ? cls.price : 0) + ' บาท</div>' +
          '<div><b>ชื่อ:</b> ' + escHtml(customerName) + '</div>' +
          '<div><b>เบอร์โทร:</b> ' + escHtml(customerPhone) + '</div>' +
          (staffCode ? '<div><b>รหัสแนะนำ:</b> ' + escHtml(staffCode) + '</div>' : '');
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('doneCard').style.display = 'block';
      } catch (err) {
        msg.textContent = 'ส่งไม่สำเร็จ: ' + err.message;
        btn.disabled = false;
      }
    });

    loadClasses().catch(function (e) {
      document.getElementById('formMsg').textContent = 'โหลดรายการคลาสไม่สำเร็จ: ' + e.message;
    });
  </script>
</body>
</html>
