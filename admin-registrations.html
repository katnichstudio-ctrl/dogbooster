<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DogBooster — ใบสมัคร (Admin)</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold:#F0B74C; --gold-dark:#E0A02F; --dark:#15130F; --cream:#FAF7F1; --bg:#E7E2D7; --border:#E4DECF; --muted:#6B6459; --red:#B4452F; }
    html, body { font-family:'LINE Seed Sans TH',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--dark); -webkit-font-smoothing:antialiased; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { font-size: 24px; font-weight: 800; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    a.navlink { color: var(--muted); font-size: 13px; text-decoration: underline; }

    .gate { max-width: 380px; margin: 60px auto; background:#fff; border:1px solid var(--border); border-radius:18px; padding:26px; }
    .gate h2 { font-size: 18px; font-weight: 800; }
    .gate p { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .field { width:100%; margin-top:16px; padding:13px 15px; border:1.5px solid var(--border); border-radius:12px; font-family:inherit; font-size:15px; font-weight:600; outline:none; }
    .field:focus { border-color: var(--gold); }
    .btn { border:none; border-radius:100px; padding:11px 20px; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; color:var(--dark); background:var(--gold); }
    .btn:hover { background: var(--gold-dark); }
    .btn.block { width:100%; border-radius:12px; padding:14px; margin-top:14px; }
    .btn.sm { padding:7px 14px; font-size:12px; }
    .btn.outline { background:#fff; border:1.5px solid var(--red); color:var(--red); }
    .btn.ghost { background:#EDE7DA; }

    .toolbar { display:flex; gap:12px; align-items:center; margin:20px 0 14px; flex-wrap:wrap; }
    .search { flex:1; min-width:200px; padding:11px 14px; border:1.5px solid var(--border); border-radius:12px; font-family:inherit; font-size:14px; outline:none; }
    .search:focus { border-color: var(--gold); }
    .msg { font-size:13px; color:var(--muted); }
    .msg.err { color:#B4452F; }

    .tablecard { background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    .tablescroll { overflow-x:auto; }
    table { border-collapse: collapse; width:100%; min-width:820px; }
    th, td { padding:12px 14px; text-align:left; border-bottom:1px solid var(--border); font-size:13.5px; white-space:nowrap; }
    th { background:#F6F2E9; font-weight:800; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; position:sticky; top:0; }
    select.statusSel { padding:6px 10px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:12.5px; font-weight:700; }
    .pill { display:inline-block; padding:3px 10px; border-radius:100px; font-size:11.5px; font-weight:800; }
    .pill.pending { background:#F6F2E9; color:var(--muted); }
    .pill.confirmed { background:#E4F3E9; color:#2E7D4F; }
    .pill.cancelled { background:#FBEDEA; color:var(--red); }
    .empty { padding:40px; text-align:center; color:var(--muted); font-size:14px; }
    .count-pill { background:var(--dark); color:var(--gold); font-size:12px; font-weight:800; padding:4px 11px; border-radius:100px; }
  </style>
</head>
<body>
  <div id="gate" class="gate">
    <h2>เข้าสู่ระบบแอดมิน</h2>
    <p>ใส่ Admin Token (ค่าเดียวกับ <code>ADMIN_TOKEN</code> ที่ตั้งไว้ใน Vercel)</p>
    <input id="token" class="field" type="password" placeholder="Admin token" autocomplete="off">
    <button class="btn block" onclick="enter()">เข้าสู่ระบบ</button>
    <p id="gate-msg" class="msg err" style="margin-top:12px"></p>
  </div>

  <div id="app" class="wrap" style="display:none">
    <a class="navlink" href="/admin-pricing.html">← ราคา/ค่าคอมมิชชัน และสตาฟ</a>
    <h1 style="margin-top:8px">ใบสมัครเรียน</h1>
    <p class="sub">รายการที่ลูกค้าส่งมาจากหน้า /register.html</p>

    <div class="toolbar">
      <input id="search" class="search" placeholder="ค้นหาชื่อ / เบอร์โทร / คลาส / รหัสแนะนำ" oninput="renderRows()">
      <span id="count" class="count-pill">0 รายการ</span>
      <button class="btn sm" onclick="loadRows()">รีเฟรช</button>
      <span id="msg" class="msg"></span>
    </div>

    <div class="tablecard">
      <div class="tablescroll">
        <table id="tbl">
          <thead>
            <tr>
              <th>วันที่</th><th>ลูกค้า</th><th>เบอร์โทร</th><th>คลาส</th><th>ราคา</th>
              <th>รหัสแนะนำ</th><th>สถานะ</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" style="display:none">ยังไม่มีใบสมัคร</div>
    </div>
  </div>

  <script>
    var TOKEN = sessionStorage.getItem('db_admin_token') || '';
    var ROWS = [];

    function escHtml(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function fmtPrice(n) { return Number(n || 0).toLocaleString('th-TH'); }
    function setMsg(t, isErr) {
      var el = document.getElementById('msg');
      el.textContent = t || ''; el.className = 'msg' + (isErr ? ' err' : '');
    }

    async function api(path, opts) {
      opts = opts || {};
      opts.headers = Object.assign({ 'x-admin-token': TOKEN }, opts.headers || {});
      var r = await fetch(path, opts);
      if (r.status === 401) { throw new Error('unauthorized'); }
      if (!r.ok) { var t = await r.text(); throw new Error(t || ('error ' + r.status)); }
      return r.json();
    }

    async function enter() {
      TOKEN = document.getElementById('token').value.trim();
      if (!TOKEN) return;
      try {
        await loadRows();
        sessionStorage.setItem('db_admin_token', TOKEN);
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      } catch (e) {
        document.getElementById('gate-msg').textContent =
          e.message === 'unauthorized' ? 'Token ไม่ถูกต้อง' : ('ผิดพลาด: ' + e.message);
      }
    }

    async function loadRows() {
      var data = await api('/api/admin-registrations');
      ROWS = data.registrations || [];
      renderRows();
      setMsg('โหลดล่าสุด ' + new Date().toLocaleTimeString('th-TH'));
    }

    function renderRows() {
      var q = (document.getElementById('search').value || '').toLowerCase().trim();
      var rows = ROWS.filter(function (r) {
        if (!q) return true;
        return (r.customer_name || '').toLowerCase().indexOf(q) > -1 ||
               (r.customer_phone || '').toLowerCase().indexOf(q) > -1 ||
               (r.class_label || '').toLowerCase().indexOf(q) > -1 ||
               (r.staff_code || '').toLowerCase().indexOf(q) > -1;
      });
      document.getElementById('count').textContent = rows.length + ' รายการ';
      document.getElementById('empty').style.display = ROWS.length ? 'none' : 'block';

      var html = '';
      rows.forEach(function (r) {
        var referrer = r.staff_code
          ? escHtml(r.staff_code) + (r.staff && r.staff.name ? ' (' + escHtml(r.staff.name) + ')' : ' (ไม่พบในระบบ)')
          : '—';
        html += '<tr>' +
          '<td>' + new Date(r.created_at).toLocaleString('th-TH') + '</td>' +
          '<td>' + escHtml(r.customer_name) + '</td>' +
          '<td>' + escHtml(r.customer_phone) + '</td>' +
          '<td>' + escHtml(r.class_label) + '</td>' +
          '<td>' + fmtPrice(r.price) + '</td>' +
          '<td>' + referrer + '</td>' +
          '<td><span class="pill ' + r.status + '">' + statusLabel(r.status) + '</span></td>' +
          '<td>' +
          '<select class="statusSel" onchange="changeStatus(\'' + r.id + '\', this.value)">' +
          ['pending', 'confirmed', 'cancelled'].map(function (s) {
            return '<option value="' + s + '"' + (s === r.status ? ' selected' : '') + '>' + statusLabel(s) + '</option>';
          }).join('') +
          '</select>' +
          ' <button class="btn sm outline" style="margin-left:6px" onclick="removeRow(\'' + r.id + '\')">ลบ</button>' +
          '</td>' +
          '</tr>';
      });
      document.getElementById('tbody').innerHTML = html;
    }

    function statusLabel(s) {
      return { pending: 'รอติดต่อ', confirmed: 'ยืนยันแล้ว', cancelled: 'ยกเลิก' }[s] || s;
    }

    async function changeStatus(id, status) {
      try {
        await api('/api/admin-registrations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id, status: status })
        });
        var row = ROWS.find(function (r) { return r.id === id; });
        if (row) row.status = status;
        renderRows();
        setMsg('บันทึกแล้ว ✓');
      } catch (e) {
        setMsg('บันทึกไม่สำเร็จ: ' + e.message, true);
        loadRows();
      }
    }

    async function removeRow(id) {
      if (!confirm('ลบใบสมัครนี้?')) return;
      try {
        await api('/api/admin-registrations?id=' + encodeURIComponent(id), { method: 'DELETE' });
        ROWS = ROWS.filter(function (r) { return r.id !== id; });
        renderRows();
      } catch (e) {
        setMsg('ลบไม่สำเร็จ: ' + e.message, true);
      }
    }

    if (TOKEN) {
      loadRows().then(function () {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      }).catch(function () {
        sessionStorage.removeItem('db_admin_token'); TOKEN = '';
      });
    }
  </script>
</body>
</html>
